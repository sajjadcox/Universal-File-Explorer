name: Build Universal File Explorer APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify app/src/main exists in repository
        run: |
          if [ ! -d app/src/main ] || [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "ERROR: app/src/main folder is missing in your GitHub repository!"
            echo "Please push the complete project from AI Studio (Push to GitHub or Export as ZIP + git push)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK (API 36.1)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Generate dummy debug.keystore and .env
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Generate dummy google-services.json
        run: |
          python3 -c '
          import json, os
          path = "app/google-services.json"
          if not os.path.exists(path):
              data = {
                  "project_info": {
                      "project_number": "000000000000",
                      "project_id": "dummy-ci-project",
                      "storage_bucket": "dummy-ci-project.appspot.com"
                  },
                  "client": [{
                      "client_info": {
                          "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                          "android_client_info": {"package_name": "com.universalfileexplorer.filemanager"}
                      },
                      "oauth_client": [],
                      "api_key": [{"current_key": "AIzaSyDummyKeyForCiBuildOnly000000000"}],
                      "services": {"appinvite_service": {"other_platform_oauth_client": []}}
                  }],
                  "configuration_version": "1"
              }
              with open(path, "w") as f:
                  json.dump(data, f, indent=2)
          '

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate missing Gradle wrapper files
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalFileExplorer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
